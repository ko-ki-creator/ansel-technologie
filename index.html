<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF | Ansel Technologies</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
</head>

<body>
    <div class="wrap">
        <header>
            <!-- ヘッダー -->
            <section class="header">
                <div class="header-wrapper">
                    <div class="header-inner">
                        <div class="header-logo">
                            <img src="images/ansel-logo.png" alt="">
                        </div>
                        <div class="header-nav">
                            <nav class="nav">
                                <ul class="nav-list">
                                    <li class="nav-item">
                                        <div>
                                            <p class="ja">会社概要</p>
                                            <p class="en">COMPANY</p>
                                        </div>
                                    </li>
                                    <li class="nav-item">
                                        <div class="link link-hover">
                                            <div>
                                                <p class="ja">事業内容</p>
                                                <p class="en">SERVICE</p>
                                            </div>
                                            <div class="dropDown">
                                                <ul class="dropDown_list">
                                                    <li class="dropDown_item">
                                                        <a href="" class="dropDown_link">エンジニアスクール</a>
                                                    </li>
                                                    <li class="dropDown_item">
                                                        <a href="" class="dropDown_link">カウンセリング申込</a>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </li>
                                    <li class="nav-item">
                                        <div class="link link-hover">
                                            <div>
                                                <p class="ja">採用情報</p>
                                                <p class="en">RECRUIT</p>
                                            </div>
                                            <div class="dropDown">
                                                <ul class="dropDown_list">
                                                    <li class="dropDown_item">
                                                        <a href="" class="dropDown_link">採用情報トップ</a>
                                                    </li>
                                                    <li class="dropDown_item">
                                                        <a href="" class="dropDown_link">IT経験者採用</a>
                                                    </li>
                                                    <li class="dropDown_item">
                                                        <a href="" class="dropDown_link">スクール生採用</a>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </li>
                                    <li class="nav-item">
                                        <div class="link link-hover">
                                            <div>
                                                <p class="ja">お知らせ</p>
                                                <p class="en">NEWS</p>
                                            </div>
                                            <div class="dropDown">
                                                <ul class="dropDown_list">
                                                    <li class="dropDown_item">
                                                        <a href="" class="dropDown_link">お知らせ</a>
                                                    </li>
                                                    <li class="dropDown_item">
                                                        <a href="" class="dropDown_link">ブログ</a>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </li>
                                </ul>
                            </nav>
                            <div class="header-contact-btn">
                                <a href="">
                                    <img src="images/mail-icon.png" alt="">
                                    <p>CONTACT</p>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </header>

        <main></main>

        <footer></footer>
    </div>
    <script defer src="./js/main.js"></script>
</body>
</html>
